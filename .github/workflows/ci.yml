name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支/PR 有新提交时取消旧的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: clippy & build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 在两个真实目标平台上检查,覆盖各自的 cfg(target_os) 代码分支
        include:
          - name: macos
            os: macos-14
          - name: windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # FFI 内核是 Go 编成的 c-archive 静态库;build.rs 会跑 go build。
      # macos-14 / windows-latest 镜像自带 Go 但版本不齐,钉死 1.25 保证可复现。
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: core/go.sum

      - name: Verify Windows cgo archive tools
        if: runner.os == 'Windows'
        run: |
          clang --version
          llvm-ar --version
          llvm-objcopy --version
          llvm-lib --version

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.name }}

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # 目前只有 node_notes 的注释解析单测,但它是手写的按行解析,值得守住
      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release
